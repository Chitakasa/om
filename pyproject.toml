# Lint configuration for om. `ruff check` from the repo root; CI-compatible Python 3.10+ (stdlib only).
[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [".aider.tags.cache.v4"]
include = ["*.py", "bin/om"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "C4", "SIM", "PIE", "PLW"]
ignore = [
    "SIM108",  # a ternary is not always clearer than the if/else beside it
    "SIM105",  # contextlib.suppress hides which errors are expected; the explicit try/except documents it
    "B008", "B904",
    "PLW1510",  # core.run() is the one subprocess wrapper; callers read returncode on purpose
    "PLW0603",  # module-level state in the dashboard server is deliberate
    "UP015", "UP032",
    "PLW2901",  # `line = line.strip()` inside a loop is the idiom used throughout; renaming adds nothing
]

[tool.ruff.lint.isort]
known-first-party = ["gitops"]
