# om Stream Router (om_stream_router). Generated by om — do not edit.
global
    log stdout format raw local0
    stats socket /tmp/haproxy.sock mode 660 level admin
    maxconn 2048

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

resolvers docker
    parse-resolv-conf
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

frontend health
    mode http
    bind /tmp/health.sock mode 660
    monitor-uri /healthz
