# om Stream Edge Proxy (om_stream_edge). Generated by om — do not edit.
global
    log stdout format raw local0
    stats socket /tmp/haproxy.sock mode 660 level admin
    maxconn 2048

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend health
    mode http
    bind /tmp/health.sock mode 660
    monitor-uri /healthz
