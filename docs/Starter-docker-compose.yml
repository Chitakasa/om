# =============================================================================
#  docker-compose.yml — ALL-FIELDS REFERENCE / STARTER TEMPLATE
# =============================================================================
#  This is a REFERENCE, not a stack to run as-is. Copy it and DELETE what you
#  don't need. Live entries that point at files/networks (./Dockerfile,
#  ./app.conf, ./extra.conf, ./secrets/*.txt, network "web") must exist or be
#  removed, or `up` will fail.
#
#  How it's organised: fields that can safely coexist are LIVE. Fields that
#  conflict with each other, weaken isolation, or need something external are
#  COMMENTED OUT (still listed, so nothing is missing). Uncomment what you need.
#
#  Legend
#    [DC]     Docker Compose v2 feature; podman-compose may ignore/reject it.
#    [X]      Conflicts with another field. Pick one.
#    [!]      Weakens isolation (host access / extra privileges).
#    [WIN]    Windows containers only.
#    [podman] podman-compose specific.
#
#  Validate before running:  podman-compose config   (or: docker compose config)
#  Sizes: b, k, m, g (512m).   Durations: 500ms, 10s, 1m30s, 1h.
# =============================================================================


# ----------------------------------------------------------------------------
#  TOP-LEVEL: PROJECT
# ----------------------------------------------------------------------------

# version: "3.8"       # OBSOLETE. Compose v2 ignores it. Delete.

name: myproject         # Project name: prefix for container/network/volume names. Default = folder name.

# include:              # [DC] Merge other compose files (each keeps its own relative paths).
#   - path: ./other/compose.yaml
#     project_directory: ./other     # Base dir for resolving that file's relative paths.
#     env_file: ./other/.env         # Env file used to interpolate that file.

x-common: &common       # "x-" extension field: ignored by Compose. YAML anchor, reused with <<: *common.
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-podman:               # [podman] podman-compose global options.
  in_pod: false         # false = one container per service, no shared pod (avoids port/network clashes).


# ----------------------------------------------------------------------------
#  SERVICES
# ----------------------------------------------------------------------------
services:

  # ==========================================================================
  #  app — the "everything" service
  # ==========================================================================
  app:
    <<: *common                    # YAML merge: pulls in restart + security_opt above. Explicit keys below win.
    x-note: "extension key on a service; ignored by Compose"

    # --- IDENTITY & IMAGE ----------------------------------------------------
    image: docker.io/library/nginx:1.27-alpine  # Image to run (or the tag given to the build). Pin versions; full registry path for podman.
    pull_policy: missing           # always | never | missing | build | daily | weekly | every_<duration>.
    # pull_refresh_after: 1w       # [DC] Interval after which to re-pull. Newer field, check your version.
    platform: linux/amd64          # Target platform (os/arch[/variant]) for pull/build/run.
    container_name: app            # Fixed container name. Prevents scaling above 1.
    hostname: app-host             # Hostname seen inside the container.
    domainname: home               # Domain part of the FQDN (hostname.domainname).
    labels:                        # Metadata key/values. Dashboards, proxies (Traefik, etc.) read these.
      dashboard.name: "My App"
      dashboard.port: "8081"
    # label_file: ./labels.env     # [DC] Load labels from a KEY=VALUE file.
    annotations:                   # OCI annotations for the container (metadata for runtimes/tools).
      io.example.owner: "me"
    # profiles: [dev, debug]       # Service starts only when a profile is enabled (--profile dev).
    # extends:                     # Inherit a service definition from another file/service.
    #   file: ./base.yaml
    #   service: base_app
    scale: 1                       # Number of instances. Must stay 1 while container_name is set.
    attach: true                   # [DC] false = `up` doesn't stream this service's logs.

    # --- BUILD (used when the image should be built locally) -----------------
    build:
      context: .                   # Directory (or git URL) sent to the builder.
      dockerfile: Dockerfile       # Dockerfile path, relative to context.
      # dockerfile_inline: |       # [X] Dockerfile content written inline (instead of `dockerfile`).
      #   FROM alpine
      #   RUN apk add --no-cache curl
      args:                        # Build-time ARG values.
        APP_VERSION: "1.0"
      target: prod                 # Stop at this stage of a multi-stage Dockerfile.
      tags:                        # Extra tags applied to the built image.
        - localhost/myapp:latest
      labels:                      # Labels baked into the built image.
        org.opencontainers.image.title: "myapp"
      no_cache: false              # true = ignore build cache.
      pull: false                  # true = always pull newer base images while building.
      shm_size: 128m               # /dev/shm size during build.
      ulimits:                     # ulimits during build.
        nofile: 8192
      secrets:                     # Build-time secrets (must be declared in top-level `secrets`).
        - api_key
      # platforms: [linux/amd64, linux/arm64]   # Build for several platforms.
      # network: host              # Network mode during build (host | none | default).
      # extra_hosts:               # Extra /etc/hosts entries during build.
      #   - "registry.local:10.0.0.5"
      # ssh: ["default"]           # [DC] Forward SSH agent to build steps.
      # cache_from: ["docker.io/me/app:cache"]  # Images/caches to reuse.
      # cache_to: ["type=inline"]  # [DC] Where to export build cache.
      # additional_contexts:       # [DC] Named extra build contexts.
      #   shared: ../shared
      # provenance: false          # [DC] Attach provenance attestation.
      # sbom: false                # [DC] Attach SBOM attestation.
      # entitlements: [network.host]  # [DC][!] Extra BuildKit privileges.
      # privileged: false          # [!] Build with extended privileges.
      # isolation: default         # [WIN] Container isolation technology.

    # --- PROCESS & USER ------------------------------------------------------
    entrypoint: ["/docker-entrypoint.sh"]      # Overrides image ENTRYPOINT. List = exec form (no shell).
    command: ["nginx", "-g", "daemon off;"]    # Overrides image CMD (arguments to the entrypoint).
    working_dir: /app              # Starting directory in the container.
    user: "1000:1000"              # uid[:gid] to run as. Avoid root.
    group_add: ["1001"]            # Extra groups for the process (e.g. to access a device).
    # userns_mode: "keep-id"       # [X][podman] Map your host UID into the container (fixes bind-mount perms). Docker only allows "host".
    init: true                     # Tiny init as PID 1: reaps zombies, forwards signals.
    stdin_open: false              # Keep STDIN open (like `run -i`).
    tty: false                     # Allocate a pseudo-TTY (like `run -t`).
    stop_signal: SIGTERM           # Signal sent on stop.
    stop_grace_period: 15s         # Wait this long after stop_signal, then SIGKILL.
    restart: unless-stopped        # no | always | on-failure[:max] | unless-stopped. Podman needs Quadlet/systemd to survive reboot.

    # --- ENVIRONMENT ---------------------------------------------------------
    environment:                   # Env vars (map or list form).
      TZ: UTC
      APP_ENV: production
      PASSTHROUGH_FROM_SHELL:      # No value = copy from the shell that runs compose.
    env_file:                      # Load vars from files; later files override earlier ones.
      - path: ./.env               # (short form is just: - ./.env)
        required: false            # false = don't fail if the file is missing.
        # format: raw              # [DC] raw = no interpolation or quote processing.

    # --- NETWORKING ----------------------------------------------------------
    # In om workspaces DON'T use `ports:` — use `expose:` and let om route the
    # service (published ports bypass the edge proxy; `om doctor` flags them).
    # `ports:` is shown here only as a general compose reference.
    ports:                         # Publish container ports on the host.
      - "127.0.0.1:8081:80"        # Short form: [host_ip:]host_port:container_port[/protocol]
      - target: 443                # Long form: container port.
        published: "8443"          # Host port.
        host_ip: 127.0.0.1         # Bind address (127.0.0.1 = local only).
        protocol: tcp              # tcp | udp
        mode: host                 # host | ingress (Swarm)
        # name: https              # [DC] Human label for this mapping.
        # app_protocol: https      # [DC] Application-layer protocol hint.
    expose:                        # Document/allow ports for other containers only. Not published to host.
      - "80"
    networks:                      # Networks to join (declared in top-level `networks`).
      web:                         # Existing external network.
        aliases: [app, startpage]  # Extra DNS names for this container on this network.
      backend:
        aliases: [app-backend]
        ipv4_address: 172.28.0.10  # Static IP. Must be inside that network's ipam subnet.
        # ipv6_address: fd00::10   # Static IPv6 (needs enable_ipv6 and an IPv6 subnet).
        # link_local_ips: ["169.254.10.10"]   # Link-local addresses.
        # mac_address: "02:42:ac:1c:00:0a"    # [DC] MAC address on this network.
        # driver_opts: { foo: "bar" }         # Driver-specific per-endpoint options.
        # priority: 1000                      # [DC] Higher = attached first (decides eth0 order).
        # interface_name: eth1                # [DC] Interface name inside the container.
        # gw_priority: 10                     # [DC] Higher = supplies the default gateway.
    # network_mode: "host"         # [X][!] Replaces `networks`. host | none | bridge | service:<name> | container:<id>.
    dns:                           # DNS servers for the container.
      - 1.1.1.1
      - 9.9.9.9
    dns_search:                    # DNS search domains.
      - home
    dns_opt:                       # resolv.conf options.
      - ndots:1
    extra_hosts:                   # Extra /etc/hosts entries (host:ip).
      - "myhost.local:192.168.1.10"
      # - "gateway.local:host-gateway"   # Special value = host's gateway IP (support varies).
    # mac_address: "02:42:ac:11:00:02"    # [X] Legacy container-level MAC. Prefer per-network mac_address.
    # links: ["db:database"]       # [X] Legacy. Networks + service names already give DNS. Use depends_on for order.
    # external_links: ["legacy_db:old"]   # [X] Legacy: link to containers not managed by this file.

    # --- STORAGE -------------------------------------------------------------
    volumes:                       # Mounts. Short form: source:target[:mode]
      - ./config:/etc/app:ro       # Bind mount (host path relative to this file), read-only.
      - app_data:/var/lib/app      # Named volume (declared in top-level `volumes`).
      - type: bind                 # Long form. Types: bind | volume | tmpfs | image | npipe | cluster
        source: ./data
        target: /data
        read_only: false           # true = read-only mount.
        bind:
          propagation: rprivate    # rprivate | private | rshared | shared | rslave | slave
          create_host_path: true   # Create host dir if it doesn't exist.
          selinux: z               # z = shared label, Z = private label (SELinux hosts).
          # recursive: enabled     # [DC] Submount handling: enabled | disabled | writable | readonly
      - type: volume
        source: cache_data
        target: /cache
        volume:
          nocopy: true             # Don't copy image content into an empty volume on first mount.
          # subpath: sub/dir       # [DC] Mount only this sub-directory of the volume.
          # labels: { k: v }       # Labels on the mount.
      - type: tmpfs
        target: /scratch
        tmpfs:
          size: 64m                # Max size of the RAM-backed mount.
          # mode: 0o1777           # Directory permission bits (octal).
      # - type: image              # [DC] Mount files out of an image.
      #   source: docker.io/library/alpine:3.20
      #   target: /from-image
      #   image:
      #     subpath: /etc
      # - type: npipe              # [WIN] Windows named pipe.
      # - type: cluster            # [DC] Swarm cluster volume.
      # consistency: cached        # (any mount) macOS legacy sync hint: consistent | cached | delegated
    tmpfs:                         # Short-form RAM mounts. Needed for writable dirs when read_only: true.
      - /tmp
      - /run
    # volumes_from: ["db:ro"]      # [X] Reuse another service's volumes. <service>[:ro|rw] or container:<name>.
    read_only: true                # Root filesystem read-only. Writes only via volumes/tmpfs.
    shm_size: 64m                  # Size of /dev/shm.
    # storage_opt: { size: "10G" } # [X] Storage-driver specific quota (e.g. overlay+xfs). Errors elsewhere.

    # --- LIFECYCLE & HEALTH --------------------------------------------------
    depends_on:                    # Start order + readiness gating.
      db:
        condition: service_healthy # service_started | service_healthy | service_completed_successfully
        # restart: true            # [DC] Restart me when db is restarted/updated.
        # required: true           # [DC] false = only warn if db is missing/not started.
    healthcheck:                   # How to decide the container is healthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]  # CMD | CMD-SHELL | NONE
      interval: 30s                # Time between checks.
      timeout: 5s                  # A check taking longer counts as failed.
      retries: 3                   # Consecutive failures before "unhealthy".
      start_period: 20s            # Grace time at boot; failures here don't count.
      # start_interval: 5s         # [DC] Check interval during start_period.
      # disable: true              # [X] Turn off the image's HEALTHCHECK (same as test: ["NONE"]).
    # post_start:                  # [DC] Hooks run right after the container starts.
    #   - command: ["sh", "-c", "echo started"]
    #     user: root
    #     privileged: false
    #     working_dir: /
    #     environment: { HOOK: "1" }
    # pre_stop:                    # [DC] Hooks run just before the container stops.
    #   - command: ["sh", "-c", "echo stopping"]
    logging:
      driver: json-file            # json-file | journald | k8s-file (podman) | syslog | none ...
      options:                     # Driver options.
        max-size: "10m"            # Rotate logs at this size (stops unbounded log growth).
        max-file: "3"              # Keep this many rotated files.

    # --- RESOURCE LIMITS -----------------------------------------------------
    # Rootless podman: memory and pids limits usually work; cpu/cpuset/io limits need
    # cgroup controller delegation to your user (check cgroup.controllers).
    cpus: 1.0                      # Max CPU cores (1.5 = one and a half).
    cpu_shares: 512                # Relative CPU weight under contention (default 1024).
    # cpuset: "0-1"                # Pin to specific CPU cores (fails if a listed CPU doesn't exist).
    # cpu_period: 100000           # [X] CFS period in microseconds. Conflicts with `cpus`.
    # cpu_quota: 50000             # [X] CFS quota per period in microseconds. Conflicts with `cpus`.
    # cpu_rt_runtime: 950000       # [!] Realtime scheduler runtime in microseconds (needs kernel RT support).
    # cpu_rt_period: 1000000       # [!] Realtime scheduler period in microseconds.
    # cpu_count: 2                 # [WIN] Number of CPUs.
    # cpu_percent: 50              # [WIN] Percent of CPU.
    mem_limit: 512m                # Hard RAM cap. Exceeding it OOM-kills the container.
    mem_reservation: 256m          # Soft limit. Reclaimed first under memory pressure.
    memswap_limit: 512m            # RAM+swap total. Equal to mem_limit = no swap. -1 = unlimited swap.
    # mem_swappiness: 10           # 0-100. cgroup v1 only; ignored/rejected on cgroup v2 (Arch default).
    pids_limit: 200                # Max processes/threads (fork-bomb guard).
    oom_score_adj: 500             # -1000..1000. Higher = killed first by the host OOM killer.
    # oom_kill_disable: true       # [!] Never OOM-kill this container. Can hang the host.
    ulimits:                       # Per-process resource limits.
      nproc: 65535                 # Single value = soft and hard.
      nofile:
        soft: 20000
        hard: 40000
    sysctls:                       # Kernel params (only namespaced ones are allowed).
      net.core.somaxconn: 1024
    # blkio_config:                # Block-IO throttling. Needs the io cgroup controller (rootless usually can't).
    #   weight: 300                # Relative IO weight, 10-1000.
    #   weight_device:
    #     - path: /dev/sda
    #       weight: 400
    #   device_read_bps:
    #     - path: /dev/sda
    #       rate: 12mb
    #   device_read_iops:
    #     - path: /dev/sda
    #       rate: 120
    #   device_write_bps:
    #     - path: /dev/sda
    #       rate: 1024k
    #   device_write_iops:
    #     - path: /dev/sda
    #       rate: 30
    # deploy:                      # [DC][X] Swarm-style block; Compose v2 also honors resources. Duplicates the limits above: keep values equal or use only one.
    #   mode: replicated           # replicated | global | replicated-job | global-job
    #   replicas: 1                # Must equal `scale` if both are set.
    #   endpoint_mode: vip         # vip | dnsrr
    #   labels: { com.example.tier: web }   # Labels on the service (not the containers).
    #   update_config:             # Rolling update behavior.
    #     parallelism: 1
    #     delay: 10s
    #     failure_action: rollback # continue | rollback | pause
    #     monitor: 30s
    #     max_failure_ratio: 0.1
    #     order: stop-first        # stop-first | start-first
    #   rollback_config:           # Same keys as update_config, used when rolling back.
    #     parallelism: 1
    #     delay: 5s
    #     failure_action: pause
    #     monitor: 30s
    #     max_failure_ratio: 0.1
    #     order: stop-first
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M
    #       pids: 200
    #     reservations:
    #       cpus: "0.25"
    #       memory: 128M
    #       devices:               # e.g. GPU reservation
    #         - driver: nvidia
    #           count: 1           # or device_ids: ["0"]
    #           capabilities: [gpu]
    #           options: {}
    #   restart_policy:
    #     condition: on-failure    # none | on-failure | any
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    #   placement:                 # Swarm scheduling hints.
    #     constraints: ["node.role==manager"]
    #     preferences:
    #       - spread: node.labels.zone
    #     max_replicas_per_node: 1

    # --- SECURITY & ISOLATION ------------------------------------------------
    privileged: false              # true = near-total host access. Keep false.
    cap_drop:                      # Drop Linux capabilities (ALL = start from zero)...
      - ALL
    cap_add:                       # ...then add back only what's needed (CHOWN, SETUID, SETGID, ...).
      - NET_BIND_SERVICE
    security_opt:                  # seccomp / apparmor / label / no-new-privileges tweaks.
      - no-new-privileges:true     # Block setuid privilege escalation.
      # - label=disable            # [!] Disable SELinux separation.
      # - seccomp=unconfined       # [!] Disable the syscall filter.
      # - apparmor=unconfined      # [!] Disable the AppArmor profile.
    ipc: private                   # IPC namespace: private | shareable | host [!] | service:<name> | container:<id>
    # pid: host                    # [!] Share the host PID namespace (see all host processes).
    # uts: host                    # [!] Share the host hostname namespace.
    # cgroup: host                 # [!] host | private. cgroup namespace mode.
    # cgroup_parent: my.slice      # Place the container under a specific parent cgroup.
    # runtime: crun                # OCI runtime (runc, crun, kata...). Must be installed.
    # isolation: default           # [WIN] process | hyperv
    # credential_spec:             # [WIN] Group Managed Service Account config.
    #   config: my_credential_spec
    #   file: my-credential-spec.json
    #   registry: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Virtualization\Containers\CredentialSpecs\spec'
    # use_api_socket: true         # [DC][!] Mount the host container-engine API socket + credentials into the container.
    # device_cgroup_rules:         # [!] Allow device access by type major:minor perms.
    #   - "c 1:3 mr"
    # devices:                     # [!] Pass host devices into the container.
    #   - "/dev/ttyUSB0:/dev/ttyUSB0:rwm"      # short: host:container[:perms]
    #   - source: /dev/dri/renderD128          # long form
    #     target: /dev/dri/renderD128
    #     permissions: rwm
    # gpus: all                    # GPU access (Docker + NVIDIA toolkit). Podman uses CDI: devices: ["nvidia.com/gpu=all"].
    # gpus:                        # Long form of the same field:
    #   - driver: nvidia
    #     count: 1                 # or device_ids: ["0"]
    #     capabilities: [gpu]
    #     options: {}

    # --- SECRETS & CONFIGS (declared at top level) ---------------------------
    secrets:                       # Mounted at /run/secrets/<name>. Use for passwords/keys.
      - db_password                # Short form.
      - source: api_key            # Long form.
        target: api_key_file       # File name under /run/secrets/
        uid: "1000"
        gid: "1000"
        mode: 0440                 # File permissions (octal).
    configs:                       # Like secrets, for non-sensitive config files.
      - app_conf                   # Short form (mounted at /app_conf).
      - source: extra_conf         # Long form.
        target: /etc/app/extra.conf   # Absolute path inside the container.
        uid: "1000"
        gid: "1000"
        mode: 0440

    # --- DEV & EXTENSIONS ([DC] = Docker Compose v2 only) --------------------
    # develop:                     # [DC] Config for `compose watch` (live sync/rebuild).
    #   watch:
    #     - action: sync           # sync | rebuild | restart | sync+restart | sync+exec
    #       path: ./src            # Host path to watch.
    #       target: /app/src       # Container path to sync into.
    #       ignore: [node_modules/]
    #       include: ["**/*.py"]
    #       initial_sync: true     # Sync once on start.
    #     - action: sync+exec
    #       path: ./conf
    #       target: /app/conf
    #       exec:                  # Command run after sync.
    #         command: ["sh", "-c", "kill -HUP 1"]
    #         user: root
    #         privileged: false
    #         working_dir: /
    #         environment: { A: "b" }
    # models:                      # [DC] Bind top-level AI models to this service.
    #   llm:
    #     endpoint_var: LLM_URL    # Env var that receives the model endpoint URL.
    #     model_var: LLM_MODEL     # Env var that receives the model name.
    # provider:                    # [DC] Delegate this service to a compose plugin (cloud DB, etc.) instead of a container.
    #     type: awesomecloud       # Plugin binary name.
    #     options:
    #       type: mysql
    #       size: 256

  # ==========================================================================
  #  db — small helper service so depends_on / secrets have a real target
  # ==========================================================================
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password   # Read the password from the secret file.
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend                    # Short list form: just network names.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


# ----------------------------------------------------------------------------
#  TOP-LEVEL: NETWORKS
# ----------------------------------------------------------------------------
networks:
  web:
    external: true                 # Already exists (podman network create web). Compose won't create/delete it.
    name: web                      # Real network name. (external networks accept no other keys.)

  backend:
    name: myproject_backend        # Real name (default: <project>_backend).
    driver: bridge                 # Network driver.
    # driver_opts:                 # Driver-specific options (docker: com.docker.network.driver.mtu; podman: mtu, vlan, isolate, mode).
    #   mtu: "1500"
    attachable: false              # [DC] Swarm: allow standalone containers to attach to an overlay network.
    internal: false                # true = no outbound access to outside networks.
    enable_ipv6: false             # Enable IPv6 on this network.
    # enable_ipv4: true            # [DC] Explicitly enable/disable IPv4.
    ipam:                          # IP address management.
      driver: default
      config:
        - subnet: 172.28.0.0/16    # Network range.
          ip_range: 172.28.5.0/24  # Sub-range used for auto-assigned addresses.
          gateway: 172.28.0.1      # Gateway address.
          aux_addresses:           # Addresses reserved for other devices.
            reserved1: 172.28.0.2
      # options: { foo: "bar" }    # IPAM driver options.
    labels:
      io.example.purpose: "private backend"


# ----------------------------------------------------------------------------
#  TOP-LEVEL: VOLUMES
# ----------------------------------------------------------------------------
volumes:
  app_data:
    name: myproject_app_data       # Real name (default: <project>_app_data).
    driver: local                  # Volume driver.
    # driver_opts:                 # Bind a host dir as a named volume (host dir must exist).
    #   type: none
    #   o: bind
    #   device: /srv/app_data
    labels:
      io.example.purpose: "app data"
  db_data: {}                      # Minimal declaration: all defaults.
  cache_data: {}
  # shared_ext:
  #   external: true               # Must already exist; compose won't create/delete it. (No driver/labels here.)
  #   name: shared_data


# ----------------------------------------------------------------------------
#  TOP-LEVEL: SECRETS (sensitive data, mounted at /run/secrets/<name>)
# ----------------------------------------------------------------------------
secrets:
  db_password:
    file: ./secrets/db_password.txt    # Read from a file on the host.
  api_key:
    file: ./secrets/api_key.txt
  # env_secret:
  #   environment: API_KEY_ENV         # Read from a host environment variable.
  # inline_secret:
  #   content: "hunter2"               # [DC] Inline value. Don't commit real secrets.
  # ext_secret:
  #   external: true                   # Already exists (podman secret create ...).
  #   name: my_ext_secret
  # labeled_secret:
  #   file: ./secrets/x.txt
  #   name: real_secret_name           # Override the real name.
  #   labels: { k: v }
  #   driver: my-driver                # Secret driver (Swarm/plugins).
  #   driver_opts: { k: v }
  #   template_driver: golang          # Render the secret through a template engine.


