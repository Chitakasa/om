# om Global Core. Machine-specific values come from <state>/runtime.env and host port
# bindings from <state>/ports.yml — both generated by `om core start` (<state> = $OM_STATE_DIR).
# Always manage this stack through `om core ...` (it passes those files).

networks:
  default:
    name: om_core_net

volumes:
  # Holds om_sockguard's filtered engine socket; shared only with the dashboard.
  om_engine_ro:
    name: om_engine_ro
  # Holds the router's only listener (a unix socket); shared only with the edge.
  om_router_sock:
    name: om_router_sock
  # Holds stream router unix sockets; shared only with the stream edge.
  om_stream_sock:
    name: om_stream_sock

x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  # Edge proxy: the only container with host ports (<state>/ports.yml). Sits ONLY on
  # om_core_net, so no workspace container can reach it; workspace traffic goes edge → router.
  caddy:
    <<: *hardened
    image: docker.io/library/caddy:2.11.7@sha256:3095ad245c353e3bdb27a38f22a095c1cfa9e295ab21c0214c3e72b0e2960525
    container_name: om_caddy
    mem_limit: 256m
    pids_limit: 256
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - LAN_IP=${LAN_IP:?run om core start}
      - VPN_HTTP=${VPN_HTTP:?run om core start}
      - VPN_HTTPS=${VPN_HTTPS:?run om core start}
      - PUBLIC_HTTPS=${PUBLIC_HTTPS:?run om core start}
      - PRIVATE_NAMES=${PRIVATE_NAMES:?run om core start}
      - PUBLIC_NAMES=${PUBLIC_NAMES:?run om core start}
      - OM_EDGE_TOKEN=${OM_EDGE_TOKEN:?run om core start}
    volumes:
      # Program files come from OM_HOME; state (routes, login, PKI) from OM_STATE_DIR
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/conf.d:/etc/caddy/core.d:ro
      - ${OM_STATE_DIR:?run om core start}/routes:/etc/caddy/conf.d:ro
      - ${OM_STATE_DIR:?run om core start}/auth:/etc/caddy/auth.d:ro
      - ${OM_STATE_DIR:?run om core start}/data/caddy:/data:Z
      - ${OM_STATE_DIR:?run om core start}/data/caddy_config:/config:Z
      - om_router_sock:/run/om-router:ro
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "om.core=true"
      - "dashboard.hide=true"

  # Internal router: attached to every workspace and project network by `om` to reach
  # the services, but it listens only on a unix socket shared with the edge: no
  # container can connect to it. It still forwards only requests with the edge's token.
  router:
    <<: *hardened
    image: docker.io/library/caddy:2.11.7@sha256:3095ad245c353e3bdb27a38f22a095c1cfa9e295ab21c0214c3e72b0e2960525
    container_name: om_router
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    # The caddy binary carries a file capability; without it in the bounding set the
    # kernel refuses to exec it under no-new-privileges. Unused (the router listens on a unix socket).
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - OM_EDGE_TOKEN=${OM_EDGE_TOKEN:?run om core start}
    volumes:
      - ./caddy/router/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OM_STATE_DIR:?run om core start}/data/router:/data:Z
      - om_router_sock:/run/om-router
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "om.core=true"
      - "dashboard.hide=true"

  # Outbound allow-list proxy (docs/adr/0002-egress-proxy.md). Workspace networks are
  # internal; om attaches this to each of them, like the router. Its only route out is
  # om_core_net. Config, rules and hashed per-service credentials are rendered by om.
  egress:
    <<: *hardened
    # Built by `om core start` from core/egress/Containerfile (Squid on a pinned Alpine); the tag is a hash of it.
    image: ${OM_EGRESS_IMAGE:?run om core start}
    container_name: om_egress
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    user: squid
    entrypoint: ["squid", "-N", "-f", "/etc/om-egress/squid.conf"]
    tmpfs:
      - /tmp
      - /run
      - /var/log/squid
      - /var/spool/squid
    volumes:
      - ${OM_STATE_DIR:?run om core start}/egress:/etc/om-egress:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 3128 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "om.core=true"
      - "om.heal=restart"
      - "dashboard.hide=true"

  # Read-only engine API for the dashboard: GET container list and stats only.
  # No network at all; it speaks only through the unix socket in om_engine_ro.
  sockguard:
    <<: *hardened
    image: docker.io/library/caddy:2.11.7@sha256:3095ad245c353e3bdb27a38f22a095c1cfa9e295ab21c0214c3e72b0e2960525
    container_name: om_sockguard
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    network_mode: none
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - XDG_DATA_HOME=/tmp
      - XDG_CONFIG_HOME=/tmp
    volumes:
      - ./caddy/sockguard/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OM_ENGINE_SOCKET:?run om core start}:/var/run/docker.sock
      - om_engine_ro:/run/om-engine
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/om-engine/engine.sock && caddy validate --config /etc/caddy/Caddyfile > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "om.core=true"
      - "dashboard.hide=true"

  dashboard:
    <<: *hardened
    image: docker.io/library/alpine:3.24@sha256:71e9b7bae160ba167fa17414401b94cbcdaf3c32feeab9298bd794a2a0614c35
    container_name: om_dashboard
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    # The dashboard is `om dashboard`: om copies its Linux binary to <state>/bin/om-dashboard on `om core start`.
    command: ["/om/om-dashboard", "dashboard"]
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - GLOBAL_REGISTRY=/etc/om/workspaces.json
      - VPN_HOSTS=${VPN_HOSTS:?run om core start}
      - OM_PRIVATE_PORT_BASE=${OM_PRIVATE_PORT_BASE:?run om core start}
      - OM_PUBLIC_PORT_BASE=${OM_PUBLIC_PORT_BASE:?run om core start}
      - OM_ENGINE_SOCKET_PATH=/run/om-engine/engine.sock
    depends_on:
      - sockguard
    volumes:
      # Never the raw engine socket: only om_sockguard's read-only filter.
      - om_engine_ro:/run/om-engine:ro
      # A directory, not the file: om replaces the registry atomically (new inode)
      - ${OM_STATE_DIR:?run om core start}/registry:/etc/om:ro
      - ${OM_WALLPAPERS_DIR:?run om core start}:/wallpapers:ro
      - ${OM_STATE_DIR:?run om core start}/data/dashboard:/data:Z
      - ${OM_STATE_DIR:?run om core start}/bin:/om:ro,z
    healthcheck:
      test: ["CMD", "/om/om-dashboard", "dashboard", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "om.core=true"
      - "om.heal=restart"
      - "dashboard.hide=true"

  # Stream edge proxy: the only container publishing raw TCP stream ports (ports.yml).
  # Sits ONLY on om_core_net, so no workspace container can reach it.
  stream_edge:
    <<: *hardened
    image: docker.io/library/haproxy:3.0-alpine@sha256:35114f41284747c8b460babd0c082d5d8e0268218b167240f47d15d0474b718b
    container_name: om_stream_edge
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ${OM_STATE_DIR:?run om core start}/stream/edge.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - om_stream_sock:/run/om-stream
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "om.core=true"
      - "dashboard.hide=true"

  # Stream internal router: attached to om_core_net and every workspace network,
  # but listens ONLY on unix sockets shared with om_stream_edge in om_stream_sock.
  stream_router:
    <<: *hardened
    image: docker.io/library/haproxy:3.0-alpine@sha256:35114f41284747c8b460babd0c082d5d8e0268218b167240f47d15d0474b718b
    container_name: om_stream_router
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    volumes:
      - ${OM_STATE_DIR:?run om core start}/stream/router.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - om_stream_sock:/run/om-stream
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "om.core=true"
      - "dashboard.hide=true"
