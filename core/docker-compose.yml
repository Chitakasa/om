# om Global Core. Machine-specific values come from core/.runtime.env and host port
# bindings from core/ports.generated.yml — both generated by `om core start`.
# Always manage this stack through `om core ...` (it passes those files).

networks:
  default:
    name: om_core_net

volumes:
  portainer_data:
    name: portainer_data
  # Holds om_sockguard's filtered engine socket; shared only with the dashboard.
  om_engine_ro:
    name: om_engine_ro

x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  # Edge proxy: the only container with host ports. Sits ONLY on om_core_net, so no
  # workspace container can reach it; workspace traffic goes edge → router.
  caddy:
    <<: *hardened
    image: docker.io/library/caddy:2.11.6
    container_name: om_caddy
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - LAN_IP=${LAN_IP:?run om core start}
      - TAILSCALE_IP=${TAILSCALE_IP:?run om core start}
      - TAILSCALE_HOST=${TAILSCALE_HOST:?run om core start}
      - TAILSCALE_SHORT=${TAILSCALE_SHORT:?run om core start}
      - OM_EDGE_TOKEN=${OM_EDGE_TOKEN:?run om core start}
    volumes:
      # Program files come from OM_HOME; state (routes, login, PKI) from OM_STATE_DIR
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/conf.d:/etc/caddy/core.d:ro
      - ${OM_STATE_DIR:?run om core start}/routes:/etc/caddy/conf.d:ro
      - ${OM_STATE_DIR:?run om core start}/auth:/etc/caddy/auth.d:ro
      - ${OM_STATE_DIR:?run om core start}/data/caddy:/data:Z
      - ${OM_STATE_DIR:?run om core start}/data/caddy_config:/config:Z
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "om.core=true"
      - "dashboard.hide=true"

  # Internal router: attached to every workspace network by `om`. Accepts only
  # requests carrying the edge's secret token, so workspace containers (which can
  # reach it) can neither use it nor reach each other through it.
  router:
    <<: *hardened
    image: docker.io/library/caddy:2.11.6
    container_name: om_router
    restart: unless-stopped
    # The caddy binary carries a file capability; without it in the bounding set the
    # kernel refuses to exec it under no-new-privileges. Unused (router listens on 8000).
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - OM_EDGE_TOKEN=${OM_EDGE_TOKEN:?run om core start}
    volumes:
      - ./caddy/router/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OM_STATE_DIR:?run om core start}/data/router:/data:Z
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "om.core=true"
      - "dashboard.hide=true"

  # Read-only engine API for the dashboard: GET container list and stats only.
  # No network at all; it speaks only through the unix socket in om_engine_ro.
  sockguard:
    <<: *hardened
    image: docker.io/library/caddy:2.11.6
    container_name: om_sockguard
    restart: unless-stopped
    network_mode: none
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - XDG_DATA_HOME=/tmp
      - XDG_CONFIG_HOME=/tmp
    volumes:
      - ./caddy/sockguard/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OM_ENGINE_SOCKET:?run om core start}:/var/run/docker.sock
      - om_engine_ro:/run/om-engine
    labels:
      - "om.core=true"
      - "dashboard.hide=true"

  dashboard:
    <<: *hardened
    image: docker.io/library/python:3.14.8-alpine
    container_name: om_dashboard
    restart: unless-stopped
    working_dir: /app
    command: python3 -u server.py
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - GLOBAL_REGISTRY=/etc/om/workspaces.json
      - PYTHONDONTWRITEBYTECODE=1
      - TAILSCALE_SHORT=${TAILSCALE_SHORT:?run om core start}
      - OM_ENGINE_SOCKET_PATH=/run/om-engine/engine.sock
    depends_on:
      - sockguard
    volumes:
      # Never the raw engine socket: only om_sockguard's read-only filter.
      - om_engine_ro:/run/om-engine:ro
      # A directory, not the file: om replaces the registry atomically (new inode)
      - ${OM_STATE_DIR:?run om core start}/registry:/etc/om:ro
      - ${OM_WALLPAPERS_DIR:?run om core start}:/wallpapers:ro
      - ${OM_STATE_DIR:?run om core start}/data/dashboard:/data:Z
      - ./dashboard/app:/app:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/healthz')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "om.core=true"
      - "dashboard.hide=true"

  portainer:
    image: docker.io/portainer/portainer-ce:2.45.1
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${OM_ENGINE_SOCKET:?run om core start}:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - "om.core=true"
      - "workspace.id=core"
      - "dashboard.name=Portainer"
      - "dashboard.icon=🐳"
      - "dashboard.description=Container Management"
      - "dashboard.port=9000"
      - "dashboard.scope=private"
