name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit & CLI tests (no container engine needed)
        working-directory: tests
        # Every implicit, locale-dependent encoding is an error: on Windows it would be the
        # ANSI code page, not UTF-8, and om must behave identically on every OS.
        env:
          PYTHONWARNINGS: error::EncodingWarning
        run: python -X warn_default_encoding -m unittest discover -s . -p "test_*.py" -v

  caddy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate edge and router Caddyfiles
        run: |
          TOKEN=$(printf 'a%.0s' $(seq 64))
          mkdir -p /tmp/routes /tmp/auth
          # A generated route with everything a route can carry: own ports, aliases, dashboard paths, om.caddy
          (cd tests && python3 -c "
          from _env import load_om
          om = load_om()
          opts = {'snippet': 'header X-A b\n@old path /old*\nredir @old /new\n', 'dashboard_paths': ['/api/x*'], 'keep_prefix': True, 'aliases': ['/s']}
          open('/tmp/routes/ci-web.caddy', 'w').write(om['render_vhost']('ci', 'web', 80, opts, 3, True))
          open('/tmp/routes/ci-web.private_alias', 'w').write(om['render_alias']('ci', 'web', 20003, False, opts))
          open('/tmp/routes/ci-web.public_alias', 'w').write(om['render_alias']('ci', 'web', 21003, True, opts))
          ")
          # Same mounts as core/docker-compose.yml: program files + empty state dirs
          docker run --rm -v "$PWD/core/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/core/caddy/conf.d:/etc/caddy/core.d:ro" -v /tmp/routes:/etc/caddy/conf.d:ro -v /tmp/auth:/etc/caddy/auth.d:ro \
            -e LAN_IP=192.168.1.5 -e VPN_HTTP="http://100.64.0.1:81, http://host:81" -e VPN_HTTPS="https://100.64.0.1:444, https://host:444" \
            -e PUBLIC_HTTPS="https://192.168.1.5:8443, https://100.64.0.1:8443" \
            -e PRIVATE_NAMES="localhost 127.0.0.1 100.64.0.1 host" -e PUBLIC_NAMES="192.168.1.5 host.local 100.64.0.1 host" \
            -e OM_EDGE_TOKEN=$TOKEN \
            caddy:2.11.6 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/core/caddy/router:/etc/caddy:ro" -e OM_EDGE_TOKEN=$TOKEN \
            caddy:2.11.6 caddy validate --config /etc/caddy/Caddyfile

  # The firewall om generates for each OS, checked by that OS's own parser (address rules, VPN
  # allow-list, logging, the forward chain): nothing is loaded or changed on the runner.
  firewall-syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render the firewall with sample rules
        working-directory: tests
        run: python fw_render.py ../fw-out
      - name: nft -c (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq nftables
          sudo nft -c -f fw-out/om.nft
      - name: pfctl -n (macOS)
        if: runner.os == 'macOS'
        run: sudo pfctl -nf fw-out/om.pf
      - name: PowerShell parse + New-NetFirewallRule -WhatIf (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\fw-out\om-firewall.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          # Every rule line with -WhatIf: Windows validates ports and address lists without creating anything
          Get-Content fw-out\om-firewall.ps1 | Where-Object { $_ -like "New-NetFirewallRule*" } |
            ForEach-Object { Invoke-Expression ($_ -replace "\| Out-Null$", "-WhatIf") }
