name: CI

on:
  push:
  pull_request:

# Least privilege: no job writes to the repository or reads secrets beyond the read-only token.
permissions:
  contents: read

# A newer push to a branch supersedes its running checks; main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet (every OS om builds for)
        run: |
          for os in linux darwin windows; do GOOS=$os go vet ./...; done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Unit, golden and CLI tests (no container engine needed)
        run: go test -race ./...

  # One cell is enough: line coverage must not fall below the floors. The figure merges the unit tests with the end-to-end
  # scenarios, which run the built binary (with coverage counters) against a fake engine: the command layer is exercised
  # mostly that way. The floors sit a little under what it measured when they were set (library 88%, command layer 64%,
  # whole program 79%).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COVER_FLOOR: 80
      COVER_FLOOR_CLI: 55
      COVER_FLOOR_ALL: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Coverage floors (library; command layer; whole program)
        run: |
          OM_E2E_COVERDIR="$PWD/cover-e2e" go test -race -covermode=atomic -coverprofile=cover-unit.out ./...
          go tool covdata textfmt -i=cover-e2e -o cover-e2e.out
          # the same code block counted by both runs: add the counts
          awk 'FNR == 1 && /^mode:/ {next} {k = $1 " " $2; c[k] += $3} END {print "mode: atomic"; for (k in c) print k, c[k]}' cover-unit.out cover-e2e.out > cover.out
          pct() { go tool cover -func="$1" | awk '/^total:/ {sub("%", "", $NF); print $NF}'; }
          part() { { echo "mode: atomic"; grep "$@" cover.out; } > cover-part.out; pct cover-part.out; }
          all=$(pct cover.out)
          cli=$(part -e '/internal/cli/')
          lib=$(part -v -e '/internal/cli/' -e '/cmd/om/' -e '^mode:')
          echo "library $lib% (floor $COVER_FLOOR%)  command layer $cli% (floor $COVER_FLOOR_CLI%)  whole program $all% (floor $COVER_FLOOR_ALL%)"
          awk -v v="$lib" -v f="$COVER_FLOOR" 'BEGIN {exit !(v + 0 >= f + 0)}'
          awk -v v="$cli" -v f="$COVER_FLOOR_CLI" 'BEGIN {exit !(v + 0 >= f + 0)}'
          awk -v v="$all" -v f="$COVER_FLOOR_ALL" 'BEGIN {exit !(v + 0 >= f + 0)}'

  # The binary is static (no cgo): the dashboard container runs it in a bare Alpine image.
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Cross-build
        run: |
          GOOS=${{ matrix.target }}; GOOS=${GOOS%/*}; GOARCH=${{ matrix.target }}; GOARCH=${GOARCH#*/}
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o /tmp/om ./cmd/om
          ls -l /tmp/om
      - name: The Linux binary is statically linked
        if: startsWith(matrix.target, 'linux/amd64')
        run: |
          ! ldd /tmp/om 2>&1 | grep -q 'libc\.' || { ldd /tmp/om; exit 1; }
          /tmp/om version

  caddy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Validate edge and router Caddyfiles
        run: |
          TOKEN=$(printf 'a%.0s' $(seq 64))
          mkdir -p /tmp/routes /tmp/auth
          # A generated route with everything a route can carry: own ports, aliases, dashboard paths, om.caddy
          OM_CI_OUT=/tmp/routes go test ./internal/routes -run TestWriteCIFixtures -count=1
          ls /tmp/routes
          # Same mounts as core/compose.yml: program files + empty state dirs
          docker run --rm -v "$PWD/core/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/core/caddy/conf.d:/etc/caddy/core.d:ro" -v /tmp/routes:/etc/caddy/conf.d:ro -v /tmp/auth:/etc/caddy/auth.d:ro \
            -e LAN_IP=192.168.1.10 -e VPN_HTTP="http://100.64.0.1:81, http://host:81" -e VPN_HTTPS="https://100.64.0.1:444, https://host:444" \
            -e PUBLIC_HTTPS="https://192.168.1.10:8443, https://100.64.0.1:8443" \
            -e PRIVATE_NAMES="localhost 127.0.0.1 100.64.0.1 host" -e PUBLIC_NAMES="192.168.1.10 host.local 100.64.0.1 host" \
            -e OM_EDGE_TOKEN=$TOKEN \
            caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/core/caddy/router:/etc/caddy:ro" -e OM_EDGE_TOKEN=$TOKEN \
            caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile

  # The firewall om generates for each OS, checked by that OS's own parser (address rules, VPN
  # allow-list, logging, the forward chain): nothing is loaded or changed on the runner.
  firewall-syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Render the firewall with sample rules
        shell: bash
        run: OM_CI_OUT="$PWD/fw-out" go test ./internal/firewall -run TestWriteCIFixtures -count=1
      - name: nft -c (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq nftables
          sudo nft -c -f fw-out/om.nft
      - name: pfctl -n (macOS)
        if: runner.os == 'macOS'
        run: sudo pfctl -nf fw-out/om.pf
      - name: PowerShell parse + New-NetFirewallRule -WhatIf (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\fw-out\om-firewall.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          # Every rule line with -WhatIf: Windows validates ports and address lists without creating anything
          Get-Content fw-out\om-firewall.ps1 | Where-Object { $_ -like "New-NetFirewallRule*" } |
            ForEach-Object { Invoke-Expression ($_ -replace "\| Out-Null$", "-WhatIf") }

  # The real thing on a real engine: Podman builds the egress image, the core starts, a scaffolded
  # workspace starts behind the edge, and `om doctor` probes the perimeter (live attack checks).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OM_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build om
        run: |
          CGO_ENABLED=0 go build -trimpath -o build/om ./cmd/om
          echo "$PWD/build" >> "$GITHUB_PATH"
      - name: Podman, compose and a rootless API socket
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman docker-compose-v2 uidmap
          sudo ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          sudo mkdir -p "$XDG_RUNTIME_DIR" && sudo chown "$USER" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          (podman system service --time=0 &) ; sleep 3
          podman info --format '{{.Host.Security.Rootless}} {{.Version.Version}}'
      - name: Start the core
        run: om core start
      - name: A sample workspace behind the edge
        run: |
          mkdir /tmp/ci-sample && cd /tmp/ci-sample && git init -q
          om init ci-sample
          om add web
          om start
          curl -fsS -o /dev/null -H "Host: ci-sample.web.localhost" http://127.0.0.1/
          # the same service through the router must not be reachable from another Host
          test "$(curl -s -o /dev/null -w '%{http_code}' -m 4 -H 'Host: attacker.example' http://127.0.0.1/ || true)" != "200"
      - name: om doctor (any FAIL fails the job; warnings are expected on a runner)
        run: |
          # the runner's other login account (packer) is the CI image's, not an outsider on this machine
          mkdir -p ~/.config/om && echo "OM_TRUSTED_USERS=$(getent passwd | awk -F: '$3>=1000 && $7!~/nologin|false/ {print $1}' | paste -sd,)" >> ~/.config/om/om.env
          om doctor --json | tee doctor.json
          jq -e '[.checks[] | select(.status == "FAIL")] | length == 0' doctor.json
      - name: Logs on failure
        if: failure()
        run: |
          podman ps -a
          for c in om_caddy om_router om_egress om_dashboard; do echo "== $c"; podman logs --tail 40 $c 2>&1 || true; done
      - name: Stop
        if: always()
        run: om core stop || true

  # Every commit, past and present, scanned for committed secrets (tokens, keys, passwords).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
